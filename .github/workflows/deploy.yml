name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build for Cloudflare Pages
        run: npm run pages:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://yervhjwzpyeukawatbge.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InllcnZoand6cHlldWthd2F0YmdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzUzOTEsImV4cCI6MjA5Mzc1MTM5MX0.6gfetAaJVkCcOI1VCaKiJOt6hRs3rra23Ag5gefCMiw

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a1e85f93c3ab980908b5a8edcb5fca54
          command: pages deploy .vercel/output/static --project-name wishlist-app --commit-dirty=true
